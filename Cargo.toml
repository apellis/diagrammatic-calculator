[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/wasm", "crates/py", "bench"]
default-members = ["crates/core", "crates/cli", "bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/apellis/diagrammatic-calculator"
rust-version = "1.88"

[workspace.dependencies]
diagcalc-core = { path = "crates/core" }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
proptest = "1"

[profile.release]
debug = 1

[profile.bench]
debug = 1

# The browser build: small and fast, without debug information or symbol names.
[profile.web]
inherits = "release"
debug = false
strip = true
lto = true
codegen-units = 1
