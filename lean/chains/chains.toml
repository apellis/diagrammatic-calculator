relations = ["mixed-fe"]
doc = "The mixed relation for two distinct colours, F then E: `dg_downupFE`."

[[chain]]
name = "rel_bubble_cw_negative"
context = "kl type=A1 mu=3"
lhs = "cap_1 x_2 cup_{1,i} e()"
strategy = "once"
relations = ["bubble-cw-negative"]
doc = "A clockwise bubble of negative degree vanishes: `dg_cwNeg`."

