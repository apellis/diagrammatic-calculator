# Rewrite chains exported to Lean by `diagcalc lean-chains lean/chains/chains.toml`, which
# writes DiagcalcChains/*.lean; CI builds them against the pinned categorification-lean.
# An entry with only `lhs` proves that the left side equals its normal form; with `rhs`, that
# the two sides are equal (both are rewritten to the same normal form).

[[chain]]
name = "cross_dots_cross_A2"
context = "klr type=A2 nu=i+j"
lhs = "psi_1 x_2^2 psi_1 e(ij)"
doc = "A crossing, two dots and the crossing back, for adjacent colours of type A2: the library's `dg_cross_dots_cross` at m = 2 (see Checks.lean)."

[[chain]]
name = "cross_dots_cross_B2"
context = "klr type=B2 nu=i+j"
lhs = "psi_1 x_2^2 psi_1 e(ij)"
doc = "The same diagram for the two colours of type B2, where the double crossing has a dot term of degree 2."

[[chain]]
name = "cross_dots_cross_G2"
context = "klr type=G2 nu=i+j"
lhs = "psi_1 x_2 psi_1 e(ji)"
doc = "A crossing, a dot and the crossing back for the two colours of type G2."

[[chain]]
name = "braid_iji_A2"
context = "klr type=A2 nu=2i+j"
lhs = "psi_1 psi_2 psi_1 e(iji)"
rhs = "psi_2 psi_1 psi_2 e(iji) + e(iji)"
doc = "The braid relation with its correction term on the colour sequence iji of type A2."

[[chain]]
name = "dots_through_braid_A2"
context = "klr type=A2 nu=2i+j"
lhs = "x_1 psi_1 psi_2 psi_1 e(iji)"
doc = "A dot pushed down through a braid and straightened to the polynomial basis."

[[chain]]
name = "straighten_A3"
context = "klr type=A3 nu=i+j+k"
lhs = "psi_2 x_1 psi_1 psi_2 psi_1 e(ijk)"
doc = "A word of type A3 with a non-reduced crossing pattern, straightened to the basis."

# KL 2-category (Khovanov–Lauda, arXiv:0807.3250), checked against categorification-lean's KL3
# diagrams. The `rel_*` entries take one step of the named relation at a weight where it applies
# (`strategy = "once"`), which checks the presentation file's reading of that relation against
# the library's lemma; the others shorten a diagram with the length-decreasing rules
# (`strategy = "shrink"`). Left curls at ⟨i,μ⟩ ≥ 2 are not exported: the interchange steps that
# bring the calculator's diagram to the library's layer order exceed Lean's default heartbeats.

[[chain]]
name = "rel_zigzag_up_left"
context = "kl type=A1 mu=0"
lhs = "cap_2 cup_{1,i} e(i)"
strategy = "once"
relations = ["zigzag-up-left"]
doc = "One zigzag on an upward strand: the library's `dg_zigL'`."

[[chain]]
name = "rel_zigzag_up_right"
context = "kl type=A1 mu=0"
lhs = "cap_1 cup_{2,i*} e(i)"
strategy = "once"
relations = ["zigzag-up-right"]
doc = "The other zigzag on an upward strand: `dg_zigR'`."

[[chain]]
name = "rel_zigzag_down_left"
context = "kl type=A1 mu=0"
lhs = "cap_2 cup_{1,i*} e(i*)"
strategy = "once"
relations = ["zigzag-down-left"]
doc = "A zigzag on a downward strand: `dg_zigL'`."

[[chain]]
name = "rel_zigzag_down_right"
context = "kl type=A1 mu=0"
lhs = "cap_1 cup_{2,i} e(i*)"
strategy = "once"
relations = ["zigzag-down-right"]
doc = "The other zigzag on a downward strand: `dg_zigR'`."

[[chain]]
name = "rel_cyclic_dot_right"
context = "kl type=A1 mu=0"
lhs = "cap_1 x_2 cup_{2,i} e(i*)"
strategy = "once"
relations = ["cyclic-dot-right"]
doc = "A dot rotated by a cup and a cap: `dg_cycDotR`."

[[chain]]
name = "rel_cyclic_dot_left"
context = "kl type=A1 mu=0"
lhs = "cap_2 x_2 cup_{1,i*} e(i*)"
strategy = "once"
relations = ["cyclic-dot-left"]
doc = "The mirror rotation of a dot: `dg_cycDotL`."

[[chain]]
name = "rel_cyclic_crossing_right"
context = "kl type=A2 mu=0"
lhs = "cap_1 cap_2 psi_3 cup_{4,j} cup_{3,i} e(i* j*)"
strategy = "once"
relations = ["cyclic-crossing-right"]
doc = "A crossing rotated by cups and caps: `dg_cycCrossR`."

[[chain]]
name = "rel_cyclic_crossing_left"
context = "kl type=A2 mu=0"
lhs = "cap_3 cap_4 psi_3 cup_{2,i*} cup_{1,j*} e(i* j*)"
strategy = "once"
relations = ["cyclic-crossing-left"]
doc = "The mirror rotation of a crossing: `dg_cycCrossL`."

[[chain]]
name = "rel_mixed_ef"
context = "kl type=A2 mu=0"
lhs = "cap_1 psi_2 cup_{3,j} cap_3 psi_2 cup_{1,j*} e(i j*)"
strategy = "once"
relations = ["mixed-ef"]
doc = "The mixed relation for two distinct colours, E then F: `dg_downupEF`."

[[chain]]
