# The room is reachable only through the Pages LIVE binding, never a public Worker route.
name = "diagcalc-live"
main = "room.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "LIVE"
class_name = "DocRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocRoom"]

[[d1_databases]]
binding = "DB"
database_name = "diagcalc"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "diagcalc"
