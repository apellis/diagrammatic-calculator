# Cloudflare Pages configuration for the project "diagcalc": the static app in dist/ and the
# accounts API in functions/ (see docs/deploy.md). Secrets (GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET, SESSION_SECRET, RESEND_API_KEY) are set on the Pages project, never here.
# The database ID below is a placeholder: the deploy workflow fills it in from the repository
# secret D1_DATABASE_ID, and deploys without this file (so without accounts) while that is unset.
name = "diagcalc"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[vars]
# Share e-mails stay off until a sender on a separately verified sending domain is configured.
EMAIL_FROM = ""
# The site's address: sign-in redirects and links in e-mails use it, and the API refuses requests
# reaching it under any other host (old deployments' own addresses, previews). The public site
# stays on this hostname. For `wrangler pages dev`, override it in .dev.vars
# (APP_ORIGIN=http://localhost:8788).
APP_ORIGIN = "https://diagcalc.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "diagcalc"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "diagcalc"

[[durable_objects.bindings]]
name = "LIVE"
class_name = "DocRoom"
script_name = "diagcalc-live"

# Preview deployments (branches other than the production branch) get none of the bindings above:
# no database, no files, so they never touch production data and their API answers that accounts
# are not available.
[env.preview]
vars = { EMAIL_FROM = "" }
