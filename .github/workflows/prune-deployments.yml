# Deletes the Cloudflare Pages deployments of "diagcalc" that are older than the current
# production deployment. Each deployment keeps its own static files and server code, bound to the
# production database and storage, at its own <hash>.diagcalc.pages.dev address; old ones would
# serve code without later fixes. Run by hand (Actions, this workflow, Run workflow); with
# "dry run" it only lists what it would delete. Deployments newer than production (one being
# made right now) are never touched.
name: Prune old deployments

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List only, delete nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Delete deployments older than production
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/diagcalc"
          get() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1"; }
          prod=$(get "$api" | jq -r '.result.canonical_deployment.id')
          prod_time=$(get "$api" | jq -r '.result.canonical_deployment.created_on')
          [ -n "$prod" ] && [ "$prod" != null ] || { echo "::error::no production deployment found"; exit 1; }
          echo "::notice::production deployment $prod from $prod_time is kept"
          : > old.txt
          page=1
          while :; do
            body=$(get "$api/deployments?per_page=25&page=$page")
            n=$(echo "$body" | jq '.result | length')
            [ "$n" -gt 0 ] || break
            echo "$body" | jq -r --arg p "$prod" --arg t "$prod_time" \
              '.result[] | select(.id != $p and .created_on < $t) | "\(.id) \(.created_on) \(.environment)"' >> old.txt
            page=$((page + 1))
          done
          count=$(wc -l < old.txt)
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::dry run: $count deployments would be deleted"
            cat old.txt
            exit 0
          fi
          deleted=0
          while read -r id created env; do
            if curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/deployments/$id?force=true" > /dev/null; then
              deleted=$((deleted + 1))
            else
              echo "::warning::could not delete $id ($env, $created)"
            fi
          done < old.txt
          left=$(( $(get "$api/deployments?per_page=1" | jq '.result_info.total_count') ))
          echo "::notice::deleted $deleted of $count old deployments; $left deployments remain"
