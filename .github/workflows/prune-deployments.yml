# Old deployments retain server code and production bindings. Prune after a successful
# master deployment; keep production and anything equally recent/newer at selection time.
# Manual dashboard rollbacks must wait until pruning is cancelled and has stopped.
# Manual runs default to a dry run. The legacy list/delete marker is still supported.
name: Prune old deployments

on:
  workflow_run:
    workflows: [Deploy web app]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List only, delete nothing
        type: boolean
        default: true
  push:
    branches: [master]
    paths: [.github/prune-deployments]
  pull_request:
    paths:
      - .github/scripts/prune_deployments.py
      - .github/scripts/test_prune_deployments.py
      - .github/workflows/prune-deployments.yml

permissions:
  contents: read

concurrency:
  group: prune-deployments
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test pruning without credentials
        run: python3 -m unittest discover -s .github/scripts -p 'test_prune_deployments.py' -v
  prune:
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never execute code/artifacts from the triggering workflow's head.
          ref: master
          persist-credentials: false
          sparse-checkout: .github
      - name: Prune and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_COMMIT_HASH: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT_NAME" = workflow_run ]; then
            args+=(--delete)
          elif [ "$EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN" = false ]; then
            args+=(--delete)
          elif [ "$EVENT_NAME" = push ]; then
            read -r mode _ < .github/prune-deployments
            if [ "$mode" = delete ]; then args+=(--delete); fi
          fi
          python3 .github/scripts/prune_deployments.py "${args[@]}"
