name: Lean chains (odd-lean)

# Builds the rewrite chains of the super Kac-Moody 2-category exported by `diagcalc
# lean-chains` (lean/odd-chains/DiagcalcChains) against the pinned odd-lean commit. The Rust
# test `odd_chain_files_are_current` keeps the generated files in step with the exporter, so a
# change to the export always touches lean/odd-chains/.
#
# A cold build of the odd-lean modules the chains import is slow, so the built dependencies are
# cached by manifest and by the hand-written support library, whose imports name the library
# modules the chains use; Mathlib comes from its own cache. The pin never moves by itself, so the
# job runs when lean/odd-chains changes, and twice a week to keep the cache alive.

on:
  push:
    branches: [master]
    paths: ["lean/odd-chains/**", ".github/workflows/odd-chains.yml"]
  schedule:
    - cron: "37 4 * * 1,4"
  workflow_dispatch:

concurrency:
  group: odd-chains-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: lean/odd-chains
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Lean
        # elan, at a fixed release whose archive is checked against its known SHA-256
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -sSfL -o "$RUNNER_TEMP/elan.tar.gz" "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the dependencies and the Mathlib cache
        run: lake exe cache get < /dev/null
      - name: Restore the built dependencies
        id: deps
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            lean/odd-chains/.lake/packages/OddMath/.lake
            lean/odd-chains/.lake/packages/Categorification/.lake
            lean/odd-chains/.lake/packages/StringDiagrams/.lake
            lean/odd-chains/.lake/packages/LieLean/.lake
            lean/odd-chains/.lake/packages/DG/.lake
          key: odd-chains-deps-${{ hashFiles('lean/odd-chains/lake-manifest.json', 'lean/odd-chains/lean-toolchain') }}-${{ hashFiles('lean/odd-chains/DiagcalcSupport/**') }}
          restore-keys: |
            odd-chains-deps-${{ hashFiles('lean/odd-chains/lake-manifest.json', 'lean/odd-chains/lean-toolchain') }}-
      - name: Build the chains
        run: lake build < /dev/null
      - name: Save the built dependencies
        if: ${{ !cancelled() && steps.deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            lean/odd-chains/.lake/packages/OddMath/.lake
            lean/odd-chains/.lake/packages/Categorification/.lake
            lean/odd-chains/.lake/packages/StringDiagrams/.lake
            lean/odd-chains/.lake/packages/LieLean/.lake
            lean/odd-chains/.lake/packages/DG/.lake
          key: ${{ steps.deps.outputs.cache-primary-key }}
