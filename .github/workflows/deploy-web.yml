name: Deploy web app

# Every push to master deploys the web app to Cloudflare Pages (project "diagcalc"), where
# Cloudflare Access keeps it private until the public release. The deploy job does nothing until the
# repository has the secrets CLOUDFLARE_API_TOKEN (a token with Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. The Pages project "diagcalc" already exists.
#
# The accounts API (web/functions/, phase 6) deploys with the site. Before each deploy,
# .github/scripts/provision-accounts.sh creates what is missing on Cloudflare (D1 database and R2
# bucket "diagcalc", the Pages secret SESSION_SECRET, the DMARC record of send.ape.computer) as far
# as the API token's permissions allow, and says in the run summary what it did or why it could
# not. The D1 database ID is looked up by name (the secret D1_DATABASE_ID, if set, overrides it).
# Without both the database and the bucket the site is deployed without web/wrangler.toml, the API
# answers that accounts are not available, and the app stays anonymous. With them, the D1
# migrations are applied before the new code goes live.

on:
  push:
    branches: [master]
    paths: ["web/**", "crates/core/**", "crates/wasm/**", "presentations/**", "examples/**", "Cargo.lock", ".github/workflows/deploy-web.yml", ".github/scripts/provision-accounts.sh"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Builds the site with no access to the Cloudflare secrets: the dependencies' code runs here only.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-08
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: |
          npm ci --ignore-scripts
          npm run wasm
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  # Provisions storage, migrates the database and deploys the built site. Wrangler is installed
  # before any secret is in the environment, without running install scripts.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Protection rules and secrets of this environment are set in the repository settings.
    environment: production
    timeout-minutes: 20
    env:
      CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Not configured
        if: env.CONFIGURED != 'true'
        working-directory: .
        run: echo "No Cloudflare secrets yet; nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.CONFIGURED == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.CONFIGURED == 'true'
        with:
          name: site
          path: web/dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.CONFIGURED == 'true'
        with:
          node-version: 22
      - name: Install Wrangler
        if: env.CONFIGURED == 'true'
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts wrangler@4.149.0
      - name: Accounts storage
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: ../.github/scripts/provision-accounts.sh
      - name: Apply database migrations
        if: env.CONFIGURED == 'true' && env.ACCOUNTS == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4.149.0"
          command: d1 migrations apply diagcalc --remote
      - name: Deploy to Cloudflare Pages
        if: env.CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4.149.0"
          command: pages deploy dist --project-name=diagcalc --branch=master --commit-dirty=true
