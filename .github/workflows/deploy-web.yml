name: Deploy web app

# Every push to master deploys the web app to Cloudflare Pages (project "diagcalc"), where
# Cloudflare Access keeps it private until the public release. The job does nothing until the
# repository has the secrets CLOUDFLARE_API_TOKEN (a token with Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. The Pages project "diagcalc" already exists.
#
# The accounts API (web/functions/, phase 6) deploys with the site. Its D1 database and R2 bucket
# are bound only once the secret D1_DATABASE_ID is set (docs/deploy.md); until then the site is
# deployed without web/wrangler.toml, the API answers that accounts are not available, and the app
# stays anonymous. With the secret, the D1 migrations are applied before the new code goes live.

on:
  push:
    branches: [master]
    paths: ["web/**", "crates/core/**", "crates/wasm/**", "presentations/**", "examples/**", "Cargo.lock", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      ACCOUNTS: ${{ secrets.D1_DATABASE_ID != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Not configured
        if: env.CONFIGURED != 'true'
        working-directory: .
        run: echo "No Cloudflare secrets yet; nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.CONFIGURED == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.CONFIGURED == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.CONFIGURED == 'true'
        with:
          key: web
      - uses: taiki-e/install-action@v2
        if: env.CONFIGURED == 'true'
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        if: env.CONFIGURED == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        if: env.CONFIGURED == 'true'
        run: |
          npm ci
          npm run wasm
          npm run build
      - name: Accounts storage
        if: env.CONFIGURED == 'true'
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ "$ACCOUNTS" != true ]; then
            rm wrangler.toml
            echo "No D1_DATABASE_ID secret yet: deployed without accounts (the app stays anonymous)." >> "$GITHUB_STEP_SUMMARY"
          elif ! printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            rm wrangler.toml
            echo "ACCOUNTS=false" >> "$GITHUB_ENV"
            echo "D1_DATABASE_ID is not a D1 database ID: deployed without accounts." >> "$GITHUB_STEP_SUMMARY"
          else
            sed -i "s/^database_id = .*/database_id = \"$D1_DATABASE_ID\"/" wrangler.toml
            echo "Accounts: D1 database and R2 bucket bound, migrations applied." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply database migrations
        if: env.CONFIGURED == 'true' && env.ACCOUNTS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4.149.0"
          command: d1 migrations apply diagcalc --remote
      - name: Deploy to Cloudflare Pages
        if: env.CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4.149.0"
          command: pages deploy dist --project-name=diagcalc --branch=master --commit-dirty=true
