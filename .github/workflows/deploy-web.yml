name: Deploy web app

# Every push to master deploys the web app to https://diagcalc.pages.dev (project "diagcalc").
# The production site allows anonymous use. The deploy job does nothing until the
# repository has the secrets CLOUDFLARE_API_TOKEN (a token with Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. The Pages project "diagcalc" already exists.
#
# The accounts API (web/functions/, phase 6) deploys with the site. Before each deploy,
# .github/scripts/provision-accounts.sh creates what is missing on Cloudflare (D1 database and R2
# bucket "diagcalc", the Pages secret SESSION_SECRET) as far
# as the API token's permissions allow, and says in the run summary what it did or why it could
# not. The D1 database ID is looked up by name (the secret D1_DATABASE_ID, if set, overrides it).
# Without both the database and the bucket the site is deployed without web/wrangler.toml, the API
# answers that accounts are not available, and the app stays anonymous. With them, the D1
# migrations are applied before the new code goes live.

on:
  push:
    branches: [master]
    paths: ["web/**", "crates/core/**", "crates/wasm/**", "presentations/**", "examples/**", "Cargo.lock", ".github/workflows/deploy-web.yml", ".github/scripts/provision-accounts.sh"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Builds the site with no access to the Cloudflare secrets: the dependencies' code runs here only.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-08
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: |
          npm ci --ignore-scripts
          npm run wasm
          npm run build
      - name: Build the live room without deployment credentials
        run: npx -y wrangler@4.149.0 deploy --dry-run --config live/wrangler.toml --outdir "$RUNNER_TEMP/live-worker"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-worker
          path: ${{ runner.temp }}/live-worker
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  # Provisions storage, migrates the database and deploys the built site. Wrangler is installed
  # before any secret is in the environment, without running install scripts.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Protection rules and secrets of this environment are set in the repository settings.
    environment: production
    timeout-minutes: 20
    env:
      CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Not configured
        if: env.CONFIGURED != 'true'
        working-directory: .
        run: echo "No Cloudflare secrets yet; nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CONFIGURED == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.CONFIGURED == 'true'
        with:
          name: site
          path: web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.CONFIGURED == 'true'
        with:
          name: live-worker
          path: web/live/compiled
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CONFIGURED == 'true'
        with:
          node-version: 22
      - name: Install Wrangler
        if: env.CONFIGURED == 'true'
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts wrangler@4.149.0
      - name: Accounts storage
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: ../.github/scripts/provision-accounts.sh
      - name: Apply database migrations
        if: env.CONFIGURED == 'true' && env.ACCOUNTS == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4.149.0"
          command: d1 migrations apply diagcalc --remote
      - name: Configure the live room storage
        if: env.CONFIGURED == 'true' && env.ACCOUNTS == 'true'
        run: node scripts/configure-live.mjs
      - name: Deploy the live room before Pages
        if: env.CONFIGURED == 'true' && env.ACCOUNTS == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4.149.0"
          command: deploy live/compiled/room.js --no-bundle --config live/wrangler.toml
      - name: Deploy to Cloudflare Pages
        if: env.CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4.149.0"
          command: pages deploy dist --project-name=diagcalc --branch=master --commit-dirty=true
