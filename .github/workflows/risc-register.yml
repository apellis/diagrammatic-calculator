# Registers the accounts API with Google as the receiver of its security events (Cross-Account
# Protection), so that a person's sessions end when Google revokes this app's access, ends their
# Google sessions or disables their account (docs/deploy.md, "Revoked Google access"). Run by hand
# (Actions, this workflow, Run workflow) once the repository secret GOOGLE_RISC_KEY holds the JSON
# key of a service account with the role RISC Configuration Admin; delete the secret and the key
# afterwards. Run again, with a new key, when APP_ORIGIN changes.
name: Register Google security events

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Register the receiver
        env:
          KEY: ${{ secrets.GOOGLE_RISC_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::error::the repository secret GOOGLE_RISC_KEY is not set"; exit 1; }
          origin=$(sed -n 's/^APP_ORIGIN = "\(.*\)"$/\1/p' web/wrangler.toml)
          umask 077
          printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          node web/scripts/risc-register.mjs "$RUNNER_TEMP/key.json" "$origin" | while read -r line; do echo "::notice::$line"; done
          rm -f "$RUNNER_TEMP/key.json"
