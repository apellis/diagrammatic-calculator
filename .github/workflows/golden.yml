name: Golden corpus

# Computes the golden corpus in Lean (lean/golden/Golden.lean) and checks that the committed
# tests/golden/actions.json matches. Run by hand with "update" to commit a regenerated file.

on:
  push:
    branches: [master]
    paths: ["lean/golden/**", "tests/golden/**", ".github/workflows/golden.yml"]
  pull_request:
    paths: ["lean/golden/**", "tests/golden/**", ".github/workflows/golden.yml"]
  workflow_dispatch:
    inputs:
      update:
        description: "Commit the regenerated actions.json"
        type: boolean
        default: false

concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean/golden/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compute the golden corpus
        run: |
          lean --version
          lean --run lean/golden/Golden.lean tests/golden/cases.txt /tmp/actions.json
      - name: Compare with the committed file
        if: ${{ !inputs.update }}
        run: |
          if [ ! -f tests/golden/actions.json ]; then echo "tests/golden/actions.json is missing"; exit 1; fi
          diff -u tests/golden/actions.json /tmp/actions.json
      - name: Commit the regenerated file
        if: ${{ inputs.update }}
        run: |
          cp /tmp/actions.json tests/golden/actions.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/actions.json
          git diff --cached --quiet || git commit -m "Regenerate the golden corpus in Lean"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-actions
          path: /tmp/actions.json
          if-no-files-found: ignore
