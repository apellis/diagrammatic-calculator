[package]
name = "diagcalc-bench"
description = "Evaluation suite for the diagrammatic calculator: workloads, checks and timings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "diagcalc-bench"

[[bin]]
name = "diagcalc-bench"
path = "src/main.rs"

[dependencies]
diagcalc-core.workspace = true
serde_json.workspace = true

[features]
# `--trace FILE`: log the polynomial operations of the timed work for the arithmetic spike.
trace = ["diagcalc-core/trace"]

[[bin]]
name = "spike-replay"
path = "spike/replay.rs"
