format = "diagcalc-presentation/1"
name = "be2"
title = "Brundan-Ellis super Kac-Moody 2-category U(g)"
colours = "cartan"
objects = "explicit"
generator_order = ["x", "xd", "psi", "psid", "cup", "cupl", "cap", "capl", "lcross"]

[generators.x]
colours = "a"
source = "a"
target = "a"
degree = "(a,a)"
parity = "p(a)"
draw = "dot"

[generators.xd]
colours = "a"
source = "a*"
target = "a*"
degree = "(a,a)"
parity = "p(a)"
draw = "dot"
written = "x"

[generators.psi]
colours = "a b"
source = "a b"
target = "b a"
degree = "-(a,b)"
parity = "p(a) p(b)"
draw = "crossing"
aliases = ["ψ", "tau", "τ"]

[generators.psid]
colours = "a b"
source = "a* b*"
target = "b* a*"
degree = "-(a,b)"
parity = "p(a) p(b)"
draw = "crossing"
written = "psi"

[generators.cup]
colours = "a"
source = ""
target = "a* a"
degree = "d_a (1 + h(a))"
parity = 0
draw = "cup"
aliases = ["eta", "η"]

[generators.cupl]
colours = "a"
source = ""
target = "a a*"
degree = "d_a (1 - h(a))"
parity = "p(a) (h(a) + 1)"
draw = "cup"
written = "cup"

[generators.cap]
colours = "a"
source = "a a*"
target = ""
degree = "d_a (1 - h(a))"
parity = 0
draw = "cap"
aliases = ["eps", "ε"]

[generators.capl]
colours = "a"
source = "a* a"
target = ""
degree = "d_a (1 + h(a))"
parity = "p(a) (h(a) + 1)"
draw = "cap"
written = "cap"

[generators.lcross]
colours = "a b"
source = "a* b"
target = "b a*"
degree = 0
parity = "p(a) p(b)"
draw = "crossing"

[[relations]]
name = "zigzag-e"
colours = "a"
lhs = "cap_1 cup_{2,a*} e(a)"
rhs = "e(a)"

[[relations]]
name = "zigzag-f"
colours = "a"
lhs = "cap_2 cup_{1,a*} e(a*)"
rhs = "e(a*)"

[[relations]]
name = "square-same"
colours = "a"
lhs = "psi_1 psi_1 e(a a)"
rhs = "0"

[[relations]]
name = "square-orthogonal"
colours = "a b"
when = "a != b and a_ab = 0"
lhs = "psi_1 psi_1 e(a b)"
rhs = "e(a b)"

[[relations]]
name = "square-linked"
colours = "a b"
when = "a != b and a_ab != 0"
lhs = "psi_1 psi_1 e(a b)"
rhs = "x_1^{-a_ab} e(a b) + x_2^{-a_ba} e(a b)"

[[relations]]
name = "dot-slide-left-same"
colours = "a"
lhs = "psi_1 x_1 e(a a)"
rhs = "(-1)^{p(a)} x_2 psi_1 e(a a) + e(a a)"

[[relations]]
name = "dot-slide-left-distinct"
colours = "a b"
when = "a != b"
lhs = "psi_1 x_1 e(a b)"
rhs = "(-1)^{p(a) p(b)} x_2 psi_1 e(a b)"

[[relations]]
name = "dot-slide-right-same"
colours = "a"
lhs = "x_1 psi_1 e(a a)"
rhs = "(-1)^{p(a)} psi_1 x_2 e(a a) + e(a a)"

[[relations]]
name = "dot-slide-right-distinct"
colours = "a b"
when = "a != b"
lhs = "x_1 psi_1 e(a b)"
rhs = "(-1)^{p(a) p(b)} psi_1 x_2 e(a b)"

[[relations]]
name = "braid-corrected"
colours = "a b"
when = "a != b"
lhs = "psi_1 psi_2 psi_1 e(a b a)"
rhs = "psi_2 psi_1 psi_2 e(a b a) + sum_{s=0..-a_ab - 1} (-1)^{p(a) (p(b) + s)} x_1^{-a_ab - 1 - s} x_3^{s} e(a b a)"

[[relations]]
name = "braid"
colours = "a b c"
when = "a != c or a = b"
lhs = "psi_1 psi_2 psi_1 e(a b c)"
rhs = "psi_2 psi_1 psi_2 e(a b c)"

[[relations]]
name = "invert-distinct-ef"
colours = "a b"
when = "a != b"
lhs = "lcross_1 cap_3 psi_2 cup_{1,a*} e(b a*)"
rhs = "e(b a*)"

[[relations]]
name = "invert-distinct-fe"
colours = "a b"
when = "a != b"
lhs = "cap_3 psi_2 cup_{1,a*} lcross_1 e(a* b)"
rhs = "e(a* b)"

[[relations]]
name = "invert-fe"
colours = "a"
when = "h(a) >= 0"
lhs = "cap_3 psi_2 cup_{1,a*} lcross_1 e(a* a)"
rhs = "-e(a* a)"

[[relations]]
name = "invert-ef"
colours = "a"
when = "h(a) <= 0"
lhs = "lcross_1 cap_3 psi_2 cup_{1,a*} e(a a*)"
rhs = "-e(a a*)"

[[relations]]
name = "down-dot"
colours = "a"
lhs = "cap_2 x_2 cup_{1,a*} e(a*)"
rhs = "x_1 e(a*)"

[[relations]]
name = "down-crossing"
colours = "a b"
lhs = "cap_3 cap_4 psi_3 cup_{2,a*} cup_{1,b*} e(a* b*)"
rhs = "psi_1 e(a* b*)"

[[relations]]
name = "zigzag-left-up"
colours = "a"
lhs = "cap_2 cup_{1,a} e(a)"
rhs = "(-1)^{p(a) (h(a) + 1)} e(a)"

[[relations]]
name = "zigzag-left-down"
colours = "a"
lhs = "cap_1 cup_{2,a} e(a*)"
rhs = "e(a*)"

[[relations]]
name = "lcross-rotation"
colours = "a b"
lhs = "cap_1 psi_2 cup_{3,a} e(a* b)"
rhs = "(-1)^{p(a) p(b) (h(a) + 1)} lcross_1 e(a* b)"

[[relations]]
name = "cyclic-dot-even"
colours = "a"
when = "p(a) = 0"
lhs = "cap_1 x_2 cup_{2,a} e(a*)"
rhs = "x_1 e(a*)"

[[relations]]
name = "cyclic-crossing"
colours = "a b"
lhs = "cap_1 cap_2 psi_3 cup_{4,b} cup_{3,a} e(a* b*)"
rhs = "(-1)^{p(a) p(b) (h(a) + h(b) + 1)} psi_1 e(a* b*)"

[[relations]]
name = "bubble-left-negative"
colours = "a"
ints = { m = "0..h(a) - 2" }
lhs = "cap_1 x_1^{m} cup_{1,a} e()"
rhs = "0"

[[relations]]
name = "bubble-right-negative"
colours = "a"
ints = { m = "0..-h(a) - 2" }
lhs = "cap_1 x_2^{m} cup_{1,a*} e()"
rhs = "0"

[[relations]]
name = "bubble-left-one"
colours = "a"
when = "h(a) >= 1"
lhs = "cap_1 x_1^{h(a) - 1} cup_{1,a} e()"
rhs = "e()"

[[relations]]
name = "bubble-right-one"
colours = "a"
when = "h(a) <= -1"
lhs = "cap_1 x_2^{-h(a) - 1} cup_{1,a*} e()"
rhs = "e()"

[[representations]]
name = "kl-translation"
kind = "translation"
target = "kl"
even_only = true
images = { cap = "cap_1 e(a a*)", capl = "cap_1 e(a* a)", cup = "cup_{1,a*} e()", cupl = "cup_{1,a} e()", lcross = "cap_1 psi_2 cup_{3,a} e(a* b)", psi = "psi_1 e(a b)", psid = "psi_1 e(a* b*)", x = "x_1 e(a)", xd = "x_1 e(a*)" }
certificate.status = "literature"
certificate.reference = "Brundan, On the definition of Kac-Moody 2-category (arXiv:1501.00350), main theorem: for even colours U(g) as defined by Rouquier with these scalars is the Khovanov-Lauda 2-category; the KL normal form then rests on KL III nondegeneracy (categorification-lean KL3 calculusNondeg)"
certificate.hypotheses = "every colour even; t_ij = 1, s_ij^pq = 0, c_{lambda,i} = 1; each relation of this presentation is checked through the translation by the conformance checker"

[[representations]]
name = "quiver-hecke-basis"
kind = "quiver-hecke-basis"
roles = { crossing = "psi", dot = "x" }
certificate.status = "conditional"
certificate.reference = "odd-lean: QuiverHecke.span_nf, QuiverHecke.linearIndependent_nf (Kang-Kashiwara-Tsuchioka, arXiv:1107.1039v2, Corollary 3.15)"
certificate.hypotheses = "upward diagrams only; t_ij = 1 and s_ij^pq = 0. Normal forms are a basis of the quiver Hecke supercategory, so equal normal forms are equal in U(g). That distinct normal forms differ in U(g) follows from Brundan-Ellis's Nondegeneracy Conjecture (arXiv:1701.04133v2, Section 8), open for odd colours and proved for even data (odd-lean: EvenBridge.nondegeneracyConjecture_of_isEven)"

[lean]
encoding = "skm-cl"
module = "OddMath.SKM.Rewriting OddMath.SKM.RelationsNF OddMath.SKM.Lemma33 DiagcalcSupport.SKM DiagcalcSupport.SKMLeft"
namespace = "OddMath.SKM"
open = "CategoryTheory StringDiagrams Presentation"
generators = { cap = ".cap {a}", cup = ".cup {a}", lcross = ".lcross {a} {b}", psi = ".cross {a} {b}", x = ".dot {a}" }

[[lean.derived.capl]]
when = "h(a) < 0"
layers = [
  ["", ".dcap {a} {-h(a) - 1}", ""],
]

[[lean.derived.capl]]
when = "h(a) >= 0"
sign = "p(a) h(a)"
negate = true
layers = [
  ["", ".lcross {a} {a}", ""],
  ["", ".dot {a}", "dn {a}", "h(a)"],
  ["", ".cap {a}", ""],
]

[[lean.derived.cupl]]
when = "h(a) > 0"
layers = [
  ["", ".dcup {a} {h(a) - 1}", ""],
]

[[lean.derived.cupl]]
when = "h(a) <= 0"
sign = "p(a) (h(a) + 1)"
layers = [
  ["", ".cup {a}", ""],
  ["dn {a}", ".dot {a}", "", "-h(a)"],
  ["", ".lcross {a} {a}", ""],
]

[[lean.derived.psid]]
layers = [
  ["", ".cup {b}", "dn {a}, dn {b}"],
  ["dn {b}", ".cup {a}", "up {b}, dn {a}, dn {b}"],
  ["dn {b}, dn {a}", ".cross {a} {b}", "dn {a}, dn {b}"],
  ["dn {b}, dn {a}, up {b}", ".cap {a}", "dn {b}"],
  ["dn {b}, dn {a}", ".cap {b}", ""],
]

[[lean.derived.xd]]
layers = [
  ["", ".cup {a}", "dn {a}"],
  ["dn {a}", ".dot {a}", "dn {a}"],
  ["dn {a}", ".cap {a}", ""],
]

[lean.relations.braid]
lemma = "cl_braid Sc {a} {b} {c} ν {simp}"
proof = "exact"

[lean.relations.braid-corrected]
lemma = "cl_braidEq Sc {a} {b} ν {a!=b}"
facts = ["dn {a} {b}", "dn {b} {a}", "t {a} {b}", "s {a} {b}"]
layering = "right-first"

[lean.relations.bubble-left-negative]
lemma = "dc_bubln Sc {a} ν {m}"
proof = "tactic"

[lean.relations.bubble-left-one]
lemma = "dc_bubl1 Sc {a} ν"
proof = "tactic"

[lean.relations.bubble-right-negative]
lemma = "dc_bubrn Sc {a} ν {m}"
proof = "tactic"

[lean.relations.bubble-right-one]
lemma = "dc_bubr1 Sc {a} ν"
proof = "tactic"

[lean.relations.dot-slide-left-distinct]
lemma = "cl_slideL Sc {a} {b} ν {a!=b}"

[lean.relations.dot-slide-left-same]
lemma = "cl_slideLEq Sc {a} ν"

[lean.relations.dot-slide-right-distinct]
lemma = "cl_slideR Sc {a} {b} ν {a!=b}"

[lean.relations.dot-slide-right-same]
lemma = "cl_slideREq Sc {a} ν"

[lean.relations.down-crossing]
lemma = "rfl"
proof = "exact"

[lean.relations.down-dot]
lemma = "rfl"
proof = "exact"

[lean.relations.invert-distinct-ef]
lemma = "cl_invNe₁ Sc {a} {b} ν {a!=b}"
pattern_layering = "right-first"
proof = "exact"

[lean.relations.invert-distinct-fe]
lemma = "cl_invNe₂ Sc {a} {b} ν {a!=b}"
proof = "exact"

[lean.relations.invert-ef]
lemma = "cl_invM₂ Sc {a} ν (by norm_num [{ip a}])"
pattern_layering = "right-first"
proof = "exact"

[lean.relations.invert-fe]
lemma = "cl_invP₂ Sc {a} ν (by norm_num [{ip a}])"
proof = "exact"

[lean.relations.square-linked]
lemma = "cl_quadNe Sc {a} {b} ν {a!=b} (by norm_num [hd_{a}_{b}])"
facts = ["d {a} {b}", "dn {a} {b}", "dn {b} {a}", "t {a} {b}", "t {b} {a}", "s {a} {b}"]

[lean.relations.square-orthogonal]
lemma = "cl_quadZero Sc {a} {b} ν {a!=b} hd_{a}_{b}"
facts = ["d {a} {b}", "t {a} {b}"]

[lean.relations.square-same]
lemma = "cl_quadEq Sc {a} ν"
proof = "exact"

[lean.relations.zigzag-e]
lemma = "cl_zigE Sc {a} ν"
proof = "exact"

[lean.relations.zigzag-f]
lemma = "cl_zigF Sc {a} ν"
proof = "exact"

[lean.relations.zigzag-left-down]
lemma = "dc_zzld Sc cs {a} ν"
facts = ["cs"]
proof = "tactic"

[lean.relations.zigzag-left-up]
lemma = "dc_zzlu Sc cs {a} ν"
facts = ["cs"]
proof = "tactic"
